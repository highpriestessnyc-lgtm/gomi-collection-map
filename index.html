<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>回収マップ | 天文館ゴミ回収</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#0f1512;
    --panel:#161d19;
    --panel-2:#1e2622;
    --line:#2c3630;
    --go:#e6412e;
    --done:#2fae63;
    --amber:#e0a930;
    --muted:#8d998f;
    --white:#f5f6f0;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--white);
    font-family:"Hiragino Sans","Yu Gothic UI",-apple-system,BlinkMacSystemFont,sans-serif;
    overscroll-behavior:none;}
  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  /* ---- Home (course select) ---- */
  #home-view{display:flex; flex-direction:column; flex:1; min-height:0; background:var(--ink);}
  .home-header{padding:28px 20px 18px; flex-shrink:0;}
  .home-header .brand{margin-bottom:8px;}
  .home-date{font-size:13px; color:var(--muted); font-weight:700;}
  .home-title{font-size:22px; font-weight:800; margin-top:14px;}
  #courseCards{flex:1; overflow-y:auto; padding:4px 20px 30px; display:flex; flex-direction:column; gap:12px;}
  .course-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 18px;
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  }
  .course-card:active{background:var(--panel-2);}
  .course-card .cc-name{font-size:18px; font-weight:800;}
  .course-card .cc-sub{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .course-card .cc-count{font-size:22px; font-weight:800; color:var(--amber); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .course-card .cc-count small{display:block; font-size:11px; color:var(--muted); font-weight:700; text-align:right;}
  .course-card.all-card{border-color:var(--amber); background:#241d0d;}
  .home-empty{text-align:center; color:var(--muted); font-size:13.5px; line-height:1.9; margin-top:40px; padding:0 24px;}

  /* ---- Work container ---- */
  #work-container{display:none; flex-direction:column; flex:1; min-height:0;}
  .back-btn{
    flex-shrink:0; padding:7px 12px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--muted); font-size:12.5px; font-weight:700; cursor:pointer; margin-right:10px; align-self:flex-start;
  }

  header{background:var(--panel); border-bottom:1px solid var(--line); padding:12px 14px 10px; flex-shrink:0; z-index:20;}
  .top-row{display:flex; align-items:center; justify-content:flex-start; gap:8px;}
  .brand{font-size:11px; letter-spacing:.14em; color:var(--muted); font-weight:600; text-transform:uppercase;}
  .date-line{font-size:20px; font-weight:800; letter-spacing:.01em; margin-top:2px;}
  .date-line .yobi{color:var(--amber); margin-left:6px; font-size:15px; font-weight:700;}
  .progress-wrap{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .progress-track{flex:1; height:8px; border-radius:5px; background:var(--panel-2); overflow:hidden; border:1px solid var(--line);}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--done),#4fd587); width:0%; transition:width .35s ease;}
  .progress-num{font-size:13px; font-weight:700; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .progress-num b{color:var(--white);}

  .tabbar{display:flex; gap:6px; margin-top:10px;}
  .tab{flex:1; padding:9px 0; text-align:center; border-radius:10px; font-size:13px; font-weight:700;
    background:var(--panel-2); color:var(--muted); border:1px solid var(--line); cursor:pointer;}
  .tab.active{background:var(--amber); color:#1a1400; border-color:var(--amber);}

  .course-row{display:flex; gap:6px; margin-top:9px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .course-row::-webkit-scrollbar{display:none;}
  .course-chip{
    flex-shrink:0; padding:6px 13px; border-radius:20px; background:var(--panel-2); border:1px solid var(--line);
    font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap;
  }
  .course-chip.active{background:var(--white); color:var(--ink); border-color:var(--white);}

  #map-view{position:relative; flex:1; min-height:0;}
  #map{width:100%; height:100%; background:#d9d9d4;}
  .leaflet-container{background:#d9d9d4;}
  .leaflet-tile-pane{ filter:grayscale(1) contrast(1.05) brightness(1.04); }

  .map-color-mode .leaflet-tile-pane{ filter:none; }

  .map-hint{
    position:absolute; left:12px; top:14px; z-index:15;
    background:rgba(22,29,25,.85); border:1px solid var(--line); border-radius:10px;
    padding:6px 10px; font-size:11px; color:var(--muted); backdrop-filter:blur(4px);
  }

  .fatal-banner{
    position:fixed; left:0; right:0; top:0; z-index:100; background:#5a1414; color:#ffd9d9;
    font-size:12px; padding:10px 14px; display:none; line-height:1.5; white-space:pre-wrap;
    max-height:40vh; overflow-y:auto;
  }
  .fatal-banner.show{display:block;}
  .fatal-banner b{display:block; font-size:13px; margin-bottom:4px;}
  .toast{
    position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-20px);
    background:var(--panel); border:1px solid var(--line); color:var(--white);
    padding:10px 16px; border-radius:10px; font-size:13px; font-weight:700; z-index:60;
    opacity:0; transition:opacity .25s ease, transform .25s ease; pointer-events:none;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .style-toggle{
    position:absolute; right:14px; top:14px; z-index:15;
    background:rgba(22,29,25,.92); border:1px solid var(--line); border-radius:20px;
    padding:8px 14px; font-size:12px; font-weight:700; color:var(--white); cursor:pointer;
    backdrop-filter:blur(4px); display:flex; align-items:center; gap:6px;
  }

  .pin{
    width:30px; height:30px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    border:3px solid rgba(0,0,0,.35); box-shadow:0 2px 6px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
  }
  .pin.go{background:var(--go);}
  .pin.done{background:var(--done); opacity:.6;}
  .pin-dot{width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.92); transform:rotate(45deg);}

  .leaflet-popup-content-wrapper{background:var(--panel); color:var(--white); border-radius:12px;}
  .leaflet-popup-tip{background:var(--panel);}
  .leaflet-popup-content{margin:12px 14px;}
  .popup-name{font-weight:800; font-size:15px; margin-bottom:2px;}
  .popup-meta{font-size:11.5px; color:var(--amber); font-weight:700; margin-bottom:2px;}
  .popup-addr{font-size:12px; color:var(--muted); margin-bottom:10px;}
  .popup-hint{font-size:10.5px; color:#7fb0ff; margin-bottom:8px;}
  .popup-actions{display:flex; gap:8px;}
  .popup-btn{flex:1; padding:9px 0; border-radius:9px; border:none; font-weight:800; font-size:13px; cursor:pointer;}
  .popup-btn.mark-done{background:var(--done); color:#06210f;}
  .popup-btn.mark-go{background:var(--go); color:#2b0300;}
  .popup-btn.edit{background:var(--panel-2); color:var(--white); border:1px solid var(--line); flex:0 0 52px;}

  .legend{
    position:absolute; left:12px; bottom:12px; z-index:15;
    background:rgba(22,29,25,.92); border:1px solid var(--line); border-radius:12px;
    padding:8px 12px; font-size:12px; display:flex; gap:14px; backdrop-filter:blur(4px);
  }
  .legend span{display:flex; align-items:center; gap:6px; color:var(--muted);}
  .legend b{color:var(--white); font-variant-numeric:tabular-nums;}
  .legend i{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .legend i.go{background:var(--go);} .legend i.done{background:var(--done);}

  .fab{
    position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:40;
    width:58px; height:58px; border-radius:50%; background:var(--amber); color:#1a1400;
    border:none; font-size:28px; font-weight:700; box-shadow:0 6px 16px rgba(0,0,0,.45); cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }

  #list-view{flex:1; overflow-y:auto; padding:12px 14px 90px; display:none;}
  .list-item{
    display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:12px; margin-bottom:9px;
  }
  .list-item.done{opacity:.5;}
  .status-dot{width:14px; height:14px; border-radius:50%; flex-shrink:0; border:2px solid rgba(0,0,0,.3); cursor:pointer;}
  .status-dot.go{background:var(--go);} .status-dot.done{background:var(--done);}
  .li-body{flex:1; min-width:0; cursor:pointer;}
  .li-name{font-weight:800; font-size:15px;}
  .li-addr{font-size:12.5px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .li-tag{font-size:11px; color:var(--amber); font-weight:700; margin-top:3px;}
  .li-edit{flex-shrink:0; width:34px; height:34px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;}
  .empty-note{text-align:center; color:var(--muted); font-size:13px; margin-top:60px; line-height:1.8;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; display:none; align-items:flex-end;}
  .overlay.show{display:flex;}
  .sheet{
    width:100%; max-height:90vh; overflow-y:auto; background:var(--panel); border-radius:20px 20px 0 0;
    padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet h2{margin:0 0 14px; font-size:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); font-weight:700; margin-bottom:6px;}
  .field input{
    width:100%; padding:12px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--white); font-size:15px;
  }
  .field input:focus{outline:2px solid var(--amber); border-color:var(--amber);}
  .day-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .day-chip{
    padding:10px 0; text-align:center; border-radius:9px; background:var(--panel-2); border:1px solid var(--line);
    font-size:13px; font-weight:700; color:var(--muted); cursor:pointer;
  }
  .day-chip.on{background:var(--amber); color:#1a1400; border-color:var(--amber);}
  .day-chip.daily{grid-column:span 4; background:#3a2f14; color:var(--amber); border-color:var(--amber);}
  .day-chip.daily.on{background:var(--amber); color:#1a1400;}
  .quick-chips{display:flex; gap:7px; flex-wrap:wrap; margin-top:8px;}
  .quick-chip{padding:6px 12px; border-radius:20px; background:var(--panel-2); border:1px solid var(--line);
    font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer;}
  .quick-chip.on{background:var(--amber); color:#1a1400; border-color:var(--amber);}
  .sheet-actions{display:flex; gap:10px; margin-top:6px;}
  .btn{flex:1; padding:13px 0; border-radius:11px; border:none; font-weight:800; font-size:15px; cursor:pointer;}
  .btn.primary{background:var(--amber); color:#1a1400;}
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .btn.danger{background:transparent; color:var(--go); border:1px solid var(--go); flex:0 0 44px;}
  .btn:disabled{opacity:.5;}
  .hint{font-size:11.5px; color:var(--muted); margin-top:-6px; margin-bottom:14px; line-height:1.6;}
  .status-msg{font-size:13px; margin-top:-4px; margin-bottom:12px; min-height:16px;}


  .locate-btn{
    position:absolute; right:14px; top:60px; z-index:15;
    background:rgba(22,29,25,.92); border:1px solid var(--line); border-radius:20px;
    padding:8px 14px; font-size:12px; font-weight:700; color:var(--white); cursor:pointer;
    backdrop-filter:blur(4px); display:flex; align-items:center; gap:6px;
  }
  .locate-btn.active{background:#1c3a63; border-color:#3b6fb8; color:#bcd6ff;}
  .user-dot-wrap{width:20px; height:20px; display:flex; align-items:center; justify-content:center;}
  .user-dot{width:14px; height:14px; border-radius:50%; background:#3b82f6; border:2px solid #fff; box-shadow:0 0 0 3px rgba(59,130,246,.35);}
  .user-dot-pulse{position:absolute; width:14px; height:14px; border-radius:50%; background:rgba(59,130,246,.5); animation:pulse-dot 1.8s ease-out infinite;}
  @keyframes pulse-dot{0%{transform:scale(1); opacity:.7;} 100%{transform:scale(2.8); opacity:0;}}
  .sort-row{display:flex; align-items:center; gap:8px; margin-top:9px;}
  .sort-toggle{
    padding:6px 13px; border-radius:20px; background:var(--panel-2); border:1px solid var(--line);
    font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer;
  }
  .sort-toggle.on{background:#1c3a63; border-color:#3b6fb8; color:#bcd6ff;}
  .li-dist{color:#7fb0ff; font-weight:800;}
  .candidate-list{margin-top:-6px; margin-bottom:12px; display:flex; flex-direction:column; gap:6px;}
  .candidate-item{
    text-align:left; padding:10px 12px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--white); font-size:13px; cursor:pointer; line-height:1.4;
  }
  .candidate-item:active{background:var(--amber); color:#1a1400;}
  .candidate-item small{display:block; color:var(--muted); font-size:11px; margin-top:2px;}
  .candidate-item:active small{color:#4a3a10;}
  .tab, .course-chip, .quick-chip, .day-chip, .list-item, .status-dot, .li-body, .li-edit,
  .fab, .style-toggle, .locate-btn, .sort-toggle, .btn, .candidate-item, .popup-btn{
    touch-action: manipulation;
  }
  .status-msg.err{color:var(--go);}
  .status-msg.ok{color:var(--done);}
  .geo-status{
    font-size:12.5px; font-weight:700; padding:8px 12px; border-radius:9px; margin-bottom:10px; display:none;
  }
  .geo-status.set{display:block; background:#12301e; color:#7fe0a8; border:1px solid #1f5a38;}
  .geo-status.unset{display:block; background:#2e1414; color:#e6a3a3; border:1px solid #5a2323;}
</style>
</head>
<body>
<div id="app">

  <div id="home-view">
    <div class="home-header">
      <div class="brand">天文館 廃棄回収</div>
      <div class="home-date" id="homeDateLine">-- -- --</div>
      <div class="home-title">コースを選んでください</div>
    </div>
    <div id="courseCards"></div>
  </div>

  <div id="work-container">
    <header>
      <div class="top-row">
        <div class="back-btn" id="backHome">← コース</div>
        <div>
          <div class="brand" id="workBrand">天文館 廃棄回収</div>
          <div class="date-line" id="dateLine">-- -- --<span class="yobi" id="yobiLine"></span></div>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
        <div class="progress-num" id="progNum"><b>0</b> / 0 完了</div>
        <div class="progress-num" id="remainNum" style="color:var(--go)">残り <b>0</b> 件</div>
      </div>
      <div class="tabbar">
        <div class="tab active" data-tab="map">地図</div>
        <div class="tab" data-tab="list">リスト</div>
      </div>
      <div class="course-row" id="courseRow"></div>
      <div class="sort-row"><div class="sort-toggle" id="sortToggle">📍 近い順に並べる</div></div>
    </header>

    <div id="map-view">
      <div id="map"></div>
      <button class="style-toggle" id="styleToggle">🎨 <span id="styleLabel">モノクロ</span></button>
      <div class="map-hint">長押しでピン追加／既存ピンはドラッグで位置修正</div>
      <button class="locate-btn" id="locateBtn">📍 現在地</button>
      <div class="legend">
        <span><i class="go"></i>未回収 <b id="legendGo">0</b></span>
        <span><i class="done"></i>回収済 <b id="legendDone">0</b></span>
      </div>
    </div>

    <div id="list-view"></div>

    <button class="fab" id="fabAdd" aria-label="場所を追加">＋</button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="fatal-banner" id="fatalBanner"></div>

</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">回収先を追加</h2>
    <div class="field">
      <label>店舗・事業所名</label>
      <input id="inName" type="text" placeholder="例）居酒屋 やまと 天文館店">
    </div>
    <div class="field">
      <label>住所（店舗名で見つからない場合のみ入力）</label>
      <input id="inAddr" type="text" placeholder="例）鹿児島県鹿児島市千日町5-8">
    </div>
    <button class="btn ghost" id="btnSearchPos" style="margin-bottom:10px; width:100%;">🔍 位置を検索</button>
    <div class="hint">店舗名または住所で近くの候補を探します。合っているものをタップして位置を確定してください。位置を決めたら最後に下の「保存する」を押します。</div>
    <div class="geo-status" id="geoStatus"></div>
    <div class="candidate-list" id="candidateList"></div>
    <div class="field">
      <label>コース</label>
      <input id="inCourse" type="text" placeholder="例）コースA">
      <div class="quick-chips" id="courseQuick"></div>
    </div>
    <div class="field">
      <label>回収スケジュール</label>
      <div class="day-grid" id="dayGrid">
        <div class="day-chip daily" data-day="daily">毎日</div>
        <div class="day-chip" data-day="mon">月</div>
        <div class="day-chip" data-day="tue">火</div>
        <div class="day-chip" data-day="wed">水</div>
        <div class="day-chip" data-day="thu">木</div>
        <div class="day-chip" data-day="fri">金</div>
        <div class="day-chip" data-day="sat">土</div>
        <div class="day-chip" data-day="sun">日</div>
      </div>
    </div>
    <div class="status-msg" id="addStatus"></div>
    <div class="sheet-actions">
      <button class="btn danger" id="btnDelete" style="display:none">削除</button>
      <button class="btn ghost" id="btnCancel">キャンセル</button>
      <button class="btn primary" id="btnSave">保存する</button>
    </div>
  </div>
</div>

<script>
(function(){
  const WEEKDAYS = ['sun','mon','tue','wed','thu','fri','sat'];
  const WEEKDAYS_JA = {sun:'日',mon:'月',tue:'火',wed:'水',thu:'木',fri:'金',sat:'土'};
  const CENTER = [31.5966, 130.5571];
  const todayKey = () => {
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  };
  const todayWd = () => WEEKDAYS[new Date().getDay()];

  let locations = [];
  let collectedMap = {};
  let map, markersById = {};
  let currentTab = 'map';
  let currentCourse = 'all';
  let appView = 'home';
  let editingId = null;
  let selectedDays = new Set();

  // ---- Supabase接続 ----
  const SUPABASE_URL = 'https://gebjrhwfaoyjgmysplhb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlYmpyaHdmYW95amdteXNwbGhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTM0MjAsImV4cCI6MjA5NTg2OTQyMH0.uvRUg94EYo5bKCFJFLjf_bEqA4607gToTDje4HjgauA';
  let sb = null;
  try{
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }catch(e){
    showFatalBanner('Supabaseクライアントの初期化に失敗しました: ' + e.message);
  }

  async function loadLocations(){
    try{
      const { data, error } = await sb.from('gomi_locations').select('*').order('created_at', {ascending:true});
      if(error) throw error;
      locations = (data || []).map(row => ({
        id: row.id, name: row.name, address: row.address || '', course: row.course || '',
        lat: row.lat, lng: row.lng, schedule: row.schedule
      }));
    }catch(e){
      locations = [];
      showFatalBanner('回収先データの読み込みに失敗しました: ' + (e.message || e));
    }
  }

  async function upsertLocationRow(loc){
    try{
      const { error } = await sb.from('gomi_locations').upsert({
        id: loc.id, name: loc.name, address: loc.address, course: loc.course,
        lat: loc.lat, lng: loc.lng, schedule: loc.schedule

  async function loadCollected(){

      (data || []).forEach(r => { if(r.collected) collectedMap[r.location_id] = true; });

  async function setCollectedRow(id, val){

          .upsert({date: todayKey(), location_id: id, collected: true, updated_at: new Date().toISOString()});

    visibleTodays().forEach(loc => {
      if(loc.lat == null || loc.lng == null) return;
      const done = !!collectedMap[loc.id];
      const marker = L.marker([loc.lat, loc.lng], {icon:pinIcon(done), draggable:true, autoPan:true}).addTo(map);
      const popupHtml =
        '<div class="popup-name">'+escapeHtml(loc.name)+'</div>'+
        (loc.course ? '<div class="popup-meta">'+escapeHtml(loc.course)+'</div>' : '')+
        '<div class="popup-addr">'+escapeHtml(loc.address||'')+'</div>'+
        '<div class="popup-hint">長押ししてドラッグすると位置を修正できます</div>'+
        '<div class="popup-actions">'+
          '<button class="popup-btn edit" data-act="edit" data-id="'+loc.id+'">編集</button>'+
          '<button class="popup-btn '+(done?'mark-go':'mark-done')+'" data-act="toggle" data-id="'+loc.id+'">'+
            (done ? '未回収に戻す' : '回収済にする')+
          '</button>'+
        '</div>';

  function wireMapPinDrop(){
    // PC: 右クリックで直接ピン（既存ピンの上での右クリックは除外）
    map.on('contextmenu', (e) => {
      if(e.originalEvent && e.originalEvent.target && e.originalEvent.target.closest && e.originalEvent.target.closest('.pin')) return;
      dropPinAt(e.latlng);
    });

    // モバイル: 長押しでピン（既存ピンの上はLeafletのドラッグに任せるため対象外にする）
    let pressTimer = null;
    let startPoint = null;
    let longPressFired = false;
    const THRESHOLD = 10;
    const HOLD_MS = 600;

    map.getContainer().addEventListener('touchstart', (e) => {
      if(e.touches.length !== 1) return;
      if(e.target && e.target.closest && e.target.closest('.pin')) return;
      const t = e.touches[0];
      startPoint = {x:t.clientX, y:t.clientY};
      longPressFired = false;
      pressTimer = setTimeout(() => {
        longPressFired = true;
        const rect = map.getContainer().getBoundingClientRect();
        const point = L.point(startPoint.x - rect.left, startPoint.y - rect.top);
        const latlng = map.containerPointToLatLng(point);
        dropPinAt(latlng);
        pressTimer = null;
      }, HOLD_MS);
    }, {passive:true});

    map.getContainer().addEventListener('touchmove', (e) => {
      if(!startPoint || !pressTimer) return;
      const t = e.touches[0];
      const dx = t.clientX - startPoint.x, dy = t.clientY - startPoint.y;
      if(Math.sqrt(dx*dx+dy*dy) > THRESHOLD){
        clearTimeout(pressTimer); pressTimer = null;
      }
    }, {passive:true});

    const clearPress = () => {
      if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
      startPoint = null;
    };
    map.getContainer().addEventListener('touchend', clearPress);
    map.getContainer().addEventListener('touchcancel', clearPress);
  }


  let currentPos = null;
  let watchId = null;
  let userMarker = null, accuracyCircle = null;
  let sortByDistance = false;

  function distMeters(a, b){
    const R = 6371000;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function formatDist(m){
    return m < 1000 ? Math.round(m) + 'm' : (m/1000).toFixed(1) + 'km';
  }

  function orderedTodays(){
    const list = visibleTodays();
    if(sortByDistance && currentPos){
      return [...list].sort((a,b) => distMeters(currentPos,a) - distMeters(currentPos,b));
    }
    return list;
  }

  function updateUserMarker(){

    const ll = [currentPos.lat, currentPos.lng];
    if(!userMarker){

          className:'', iconSize:[20,20], iconAnchor:[10,10],
          html:'<div class="user-dot-wrap"><div class="user-dot-pulse"></div><div class="user-dot"></div></div>'
        }),
        zIndexOffset: 1000

      accuracyCircle = L.circle(ll, {radius: currentPos.accuracy || 30, color:'#3b82f6', weight:1, fillColor:'#3b82f6', fillOpacity:.12}).addTo(map);
    } else {
      userMarker.setLatLng(ll);
      accuracyCircle.setLatLng(ll);
      accuracyCircle.setRadius(currentPos.accuracy || 30);
    }
  }

        updateUserMarker();
        map.setView([currentPos.lat, currentPos.lng], 17);
        renderAll();
      },
      () => { showToast('現在地を取得できませんでした（位置情報の許可を確認してください）'); },
      {enableHighAccuracy:true, timeout:8000}

    if(watchId === null){

        (pos) => {

  // 現在地があればその周辺、なければ天文館周辺に検索範囲を絞る(bounded=1で全国からのヒットを防ぐ)
  const TENMONKAN_CENTER = {lat: 31.5966, lng: 130.5571};
  function localViewbox(){
    const c = currentPos || TENMONKAN_CENTER;
    const d = 0.045; // 中心から南北東西それぞれ約5km四方
    const left = c.lng - d, right = c.lng + d, top = c.lat + d, bottom = c.lat - d;
    return left + ',' + top + ',' + right + ',' + bottom;
  }
  async function reverseGeocode(lat, lng){
    try{
      const url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=18';
      const res = await fetch(url);
      if(!res.ok) return '';
      const data = await res.json();
      return (data && data.display_name) ? data.display_name : '';
    }catch(e){ return ''; }
  }

  async function geocodeRaw(q, strict){
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=jp'
      + '&viewbox=' + localViewbox() + (strict ? '&bounded=1' : '') + '&addressdetails=1&q=' + encodeURIComponent(q);
    const res = await fetch(url);
    if(!res.ok) throw new Error('geocode failed');
    const data = await res.json();
    return data.map(d => ({
      lat: parseFloat(d.lat), lng: parseFloat(d.lon),
      label: d.display_name
    }));
  }

  async function geocodeCandidates(q){
    // まずエリア内に厳密に絞って検索
    let list = await geocodeRaw(q, true);
    if(list.length === 0){
      // 見つからなければ、エリアを「優先」扱いに緩めて再検索（近さ優先・遠方でも見つかる）
      list = await geocodeRaw(q, false);
    }
    return list;
  }

  async function commitSave(geo){
    const name = document.getElementById('inName').value.trim();
    const addrInput = document.getElementById('inAddr').value.trim();
    const course = document.getElementById('inCourse').value.trim();
    const schedule = selectedDays.has('daily') ? 'daily' : Array.from(selectedDays);
    let loc;

    if(editingId){
      loc = locations.find(l => l.id === editingId);
      loc.name = name; loc.address = addrInput; loc.course = course; loc.schedule = schedule;
      loc.lat = geo.lat; loc.lng = geo.lng;
    } else {
      loc = {
        id: 'loc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
        name, address: addrInput, course, lat: geo.lat, lng: geo.lng, schedule
      };
      locations.push(loc);
    }
    renderAll();
    showToast('保存しました');
    closeSheet();
    await upsertLocationRow(loc);
  }

  function renderCandidates(list, statusEl){
    const wrap = document.getElementById('candidateList');
    let html = '';
    if(list.length === 0){
      statusEl.textContent = '近くの候補は見つかりませんでした。下のボタンで、今いるエリア付近に仮の位置を置けます。';
      statusEl.className = 'status-msg err';
    } else {
      statusEl.textContent = '近い候補を'+list.length+'件見つけました。該当する場所をタップして位置を確定してください。';
      statusEl.className = 'status-msg';
      html += list.map((c, i) =>
        '<div class="candidate-item" data-i="'+i+'">'+escapeHtml(c.label.split('、')[0] || c.label)+
        '<small>'+escapeHtml(c.label)+'</small></div>'
      ).join('');
    }
    html += '<div class="candidate-item" id="manualFallback" style="border-color:var(--amber); color:var(--amber); text-align:center; font-weight:800;">候補になくても、今のエリア付近で位置を確定する</div>';
    wrap.innerHTML = html;

    wrap.querySelectorAll('.candidate-item[data-i]').forEach(node => {
      node.onclick = () => {
        const c = list[parseInt(node.dataset.i, 10)];
        pendingGeo = {lat:c.lat, lng:c.lng};
        updateGeoStatus();
        clearCandidates();
        statusEl.textContent = '位置を確定しました。内容を確認して「保存する」を押してください。';
        statusEl.className = 'status-msg ok';
      };
    });

    document.getElementById('manualFallback').onclick = () => {
      // 全国検索はしない：現在地／地図の中心／天文館 のいずれか（必ず今のエリア内）に仮置きする
      const c = currentPos || (map ? map.getCenter() : TENMONKAN_CENTER);
      pendingGeo = {lat: c.lat, lng: c.lng};
      updateGeoStatus();
      clearCandidates();
      statusEl.textContent = '今のエリア付近に仮の位置を置きました。保存後、地図でピンをドラッグして正確な場所に合わせてください。';
      statusEl.className = 'status-msg err';
    };
  }

  document.getElementById('btnSearchPos').onclick = async () => {
    const name = document.getElementById('inName').value.trim();
    const addrInput = document.getElementById('inAddr').value.trim();
    const statusEl = document.getElementById('addStatus');
    clearCandidates();

    const query = addrInput || name;
    if(!query){
      statusEl.textContent = '店舗名か住所のどちらかを入力してから検索してください。';
      statusEl.className = 'status-msg err';
      return;
    }

    const btn = document.getElementById('btnSearchPos');
    btn.disabled = true;
    statusEl.textContent = '候補を検索中…';
    statusEl.className = 'status-msg';

    try{
      const candidates = await geocodeCandidates(query);
      renderCandidates(candidates, statusEl);
    }catch(e){
      statusEl.textContent = '通信エラーが発生しました。もう一度お試しください。';
      statusEl.className = 'status-msg err';
    }finally{
      btn.disabled = false;
    }
  };

  document.getElementById('btnSave').onclick = async () => {
    const name = document.getElementById('inName').value.trim();
    const statusEl = document.getElementById('addStatus');

    if(!name){
      statusEl.textContent = '店舗名を入力してください。';
      statusEl.className = 'status-msg err';
      return;
    }
    if(selectedDays.size === 0){
      statusEl.textContent = '回収スケジュールを選んでください。';
      statusEl.className = 'status-msg err';
      return;
    }
    if(!pendingGeo){
      statusEl.textContent = '先に「🔍 位置を検索」で場所を確定してから保存してください。';
      statusEl.className = 'status-msg err';
      return;
    }

    await commitSave(pendingGeo);
  };

  document.getElementById('styleToggle').onclick = () => {
    mapStyle = mapStyle === 'color' ? 'gray' : 'color';
    applyMapStyle();
    saveMapStyle();
  };

  document.getElementById('locateBtn').onclick = () => startLocating();
  document.getElementById('sortToggle').onclick = () => {
    sortByDistance = !sortByDistance;
    document.getElementById('sortToggle').classList.toggle('on', sortByDistance);
    if(sortByDistance && !currentPos) startLocating();
    renderAll();
  };

  (async function boot(){
    // 地図の初期化に失敗しても、リストや保存機能は独立して動くようにする
    try{
      initMap();
      wireMapPinDrop();
      setTimeout(() => map.invalidateSize(), 100);
      setTimeout(() => map.invalidateSize(), 500);
      setTimeout(() => map.invalidateSize(), 1200);
      window.addEventListener('resize', () => map.invalidateSize());
      window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 300));
    }catch(e){
      showFatalBanner('地図の初期化に失敗しました: ' + (e.message || e));
    }

    loadMapStyle();
    applyMapStyle();

    document.getElementById('list-view').style.display = 'none';
    showView();

    await loadLocations();
    await loadCollected();
    renderAll();
    subscribeRealtime();
  })();

})();
</script>
</body>
</html>
