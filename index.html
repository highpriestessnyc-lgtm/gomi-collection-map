<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>回収マップ | 天文館ゴミ回収</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --ink:#0f1512;
    --panel:#161d19;
    --panel-2:#1e2622;
    --line:#2c3630;
    --go:#e6412e;
    --done:#2fae63;
    --amber:#e0a930;
    --muted:#8d998f;
    --white:#f5f6f0;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);color:var(--white);
    font-family:"Hiragino Sans","Yu Gothic UI",-apple-system,BlinkMacSystemFont,sans-serif;
    overscroll-behavior:none;}
  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  /* ---- Home (course select) ---- */
  #home-view{display:flex; flex-direction:column; flex:1; min-height:0; background:var(--ink);}
  .home-header{padding:28px 20px 18px; flex-shrink:0;}
  .home-header .brand{margin-bottom:8px;}
  .home-date{font-size:13px; color:var(--muted); font-weight:700;}
  .home-title{font-size:22px; font-weight:800; margin-top:14px;}
  #courseCards{flex:1; overflow-y:auto; padding:4px 20px 30px; display:flex; flex-direction:column; gap:12px;}
  .course-card{
    background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:18px 18px;
    display:flex; align-items:center; justify-content:space-between; cursor:pointer;
  }
  .course-card:active{background:var(--panel-2);}
  .course-card .cc-name{font-size:18px; font-weight:800;}
  .course-card .cc-sub{font-size:12.5px; color:var(--muted); margin-top:4px;}
  .course-card .cc-count{font-size:22px; font-weight:800; color:var(--amber); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .course-card .cc-count small{display:block; font-size:11px; color:var(--muted); font-weight:700; text-align:right;}
  .course-card.all-card{border-color:var(--amber); background:#241d0d;}
  .course-card.add-card{border:1px dashed var(--muted); background:transparent; justify-content:flex-start;}
  .course-card.add-card .cc-name{color:var(--amber);}
  .cc-edit{
    flex-shrink:0; width:30px; height:30px; border-radius:8px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:13px; margin-left:8px;
  }
  .cc-edit:active{background:var(--amber); color:#1a1400;}
  .home-empty{text-align:center; color:var(--muted); font-size:13.5px; line-height:1.9; margin-top:40px; padding:0 24px;}

  /* ---- Work container ---- */
  #work-container{display:none; flex-direction:column; flex:1; min-height:0;}
  .back-btn{
    flex-shrink:0; padding:7px 12px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--muted); font-size:12.5px; font-weight:700; cursor:pointer; margin-right:10px; align-self:flex-start;
  }

  header{background:var(--panel); border-bottom:1px solid var(--line); padding:12px 14px 10px; flex-shrink:0; z-index:20;}
  .top-row{display:flex; align-items:center; justify-content:flex-start; gap:8px;}
  .brand{font-size:11px; letter-spacing:.14em; color:var(--muted); font-weight:600; text-transform:uppercase;}
  .date-line{font-size:20px; font-weight:800; letter-spacing:.01em; margin-top:2px;}
  .date-line .yobi{color:var(--amber); margin-left:6px; font-size:15px; font-weight:700;}
  .progress-wrap{display:flex; align-items:center; gap:10px; margin-top:10px;}
  .progress-track{flex:1; height:8px; border-radius:5px; background:var(--panel-2); overflow:hidden; border:1px solid var(--line);}
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--done),#4fd587); width:0%; transition:width .35s ease;}
  .progress-num{font-size:13px; font-weight:700; color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .progress-num b{color:var(--white);}

  .tabbar{display:flex; gap:6px; margin-top:10px;}
  .tab{flex:1; padding:9px 0; text-align:center; border-radius:10px; font-size:13px; font-weight:700;
    background:var(--panel-2); color:var(--muted); border:1px solid var(--line); cursor:pointer;}
  .tab.active{background:var(--amber); color:#1a1400; border-color:var(--amber);}

  .course-row{display:flex; gap:6px; margin-top:9px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none;}
  .course-row::-webkit-scrollbar{display:none;}
  .course-chip{
    flex-shrink:0; padding:6px 13px; border-radius:20px; background:var(--panel-2); border:1px solid var(--line);
    font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer; white-space:nowrap;
  }
  .course-chip.active{background:var(--white); color:var(--ink); border-color:var(--white);}

  #map-view{position:relative; flex:1; min-height:0;}
  #map{width:100%; height:100%; background:#d9d9d4;}
  .leaflet-container{background:#d9d9d4;}
  .leaflet-tile-pane{ filter:grayscale(1) contrast(1.05) brightness(1.04); }

  .map-color-mode .leaflet-tile-pane{ filter:none; }

  .map-hint{
    position:absolute; left:12px; top:14px; z-index:15;
    background:rgba(22,29,25,.85); border:1px solid var(--line); border-radius:10px;
    padding:6px 10px; font-size:11px; color:var(--muted); backdrop-filter:blur(4px);
  }

  .fatal-banner{
    position:fixed; left:0; right:0; top:0; z-index:100; background:#5a1414; color:#ffd9d9;
    font-size:12px; padding:10px 14px; display:none; line-height:1.5; white-space:pre-wrap;
    max-height:40vh; overflow-y:auto;
  }
  .fatal-banner.show{display:block;}
  .fatal-banner b{display:block; font-size:13px; margin-bottom:4px;}
  .toast{
    position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-20px);
    background:var(--panel); border:1px solid var(--line); color:var(--white);
    padding:10px 16px; border-radius:10px; font-size:13px; font-weight:700; z-index:60;
    opacity:0; transition:opacity .25s ease, transform .25s ease; pointer-events:none;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .style-toggle{
    position:absolute; right:14px; top:14px; z-index:15;
    background:rgba(22,29,25,.92); border:1px solid var(--line); border-radius:20px;
    padding:8px 14px; font-size:12px; font-weight:700; color:var(--white); cursor:pointer;
    backdrop-filter:blur(4px); display:flex; align-items:center; gap:6px;
  }

  .pin{
    width:30px; height:30px; border-radius:50% 50% 50% 0; transform:rotate(-45deg);
    border:3px solid rgba(0,0,0,.35); box-shadow:0 2px 6px rgba(0,0,0,.5);
    display:flex; align-items:center; justify-content:center;
  }
  .pin.go{background:var(--go);}
  .pin.done{background:var(--done); opacity:.6;}
  .pin-dot{width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,.92); transform:rotate(45deg);}

  .leaflet-popup-content-wrapper{background:var(--panel); color:var(--white); border-radius:12px;}
  .leaflet-popup-tip{background:var(--panel);}
  .leaflet-popup-content{margin:12px 14px;}
  .popup-name{font-weight:800; font-size:15px; margin-bottom:2px;}
  .popup-meta{font-size:11.5px; color:var(--amber); font-weight:700; margin-bottom:2px;}
  .popup-addr{font-size:12px; color:var(--muted); margin-bottom:4px;}
  .popup-addr.map-addr{color:#7fb0ff; margin-bottom:10px;}
  .popup-addr b{color:var(--white); font-weight:700;}
  .popup-hint{font-size:10.5px; color:#7fb0ff; margin-bottom:8px;}
  .popup-actions{display:flex; gap:8px;}
  .popup-btn{flex:1; padding:9px 0; border-radius:9px; border:none; font-weight:800; font-size:13px; cursor:pointer;}
  .popup-btn.mark-done{background:var(--done); color:#06210f;}
  .popup-btn.mark-go{background:var(--go); color:#2b0300;}
  .popup-btn.edit{background:var(--panel-2); color:var(--white); border:1px solid var(--line); flex:0 0 52px;}

  .legend{
    position:absolute; left:12px; bottom:12px; z-index:15;
    background:rgba(22,29,25,.92); border:1px solid var(--line); border-radius:12px;
    padding:8px 12px; font-size:12px; display:flex; gap:14px; backdrop-filter:blur(4px);
  }
  .legend span{display:flex; align-items:center; gap:6px; color:var(--muted);}
  .legend b{color:var(--white); font-variant-numeric:tabular-nums;}
  .legend i{width:10px; height:10px; border-radius:50%; display:inline-block;}
  .legend i.go{background:var(--go);} .legend i.done{background:var(--done);}

  .fab{
    position:fixed; right:16px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:40;
    width:58px; height:58px; border-radius:50%; background:var(--amber); color:#1a1400;
    border:none; font-size:28px; font-weight:700; box-shadow:0 6px 16px rgba(0,0,0,.45); cursor:pointer;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }

  #list-view{flex:1; overflow-y:auto; padding:12px 14px 90px; display:none;}
  .list-item{
    display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:12px; margin-bottom:9px;
  }
  .list-item.done{opacity:.5;}
  .list-item.selected{border-color:var(--go); background:#241414;}
  .status-dot{width:14px; height:14px; border-radius:50%; flex-shrink:0; border:2px solid rgba(0,0,0,.3); cursor:pointer;}
  .status-dot.go{background:var(--go);} .status-dot.done{background:var(--done);}
  .li-body{flex:1; min-width:0; cursor:pointer;}
  .li-name{font-weight:800; font-size:15px;}
  .li-addr{font-size:12.5px; color:var(--muted); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .li-addr-map{color:#7fb0ff;}
  .li-tag{font-size:11px; color:var(--amber); font-weight:700; margin-top:3px;}
  .li-reorder{flex-shrink:0; display:flex; flex-direction:column; gap:4px;}
  .li-move{
    width:30px; height:24px; border-radius:7px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:12px; cursor:pointer;
  }
  .li-move:active{background:var(--amber); color:#1a1400;}
  .li-call{
    flex-shrink:0; width:34px; height:34px; border-radius:9px; background:#12301e; border:1px solid #1f5a38;
    color:#7fe0a8; display:flex; align-items:center; justify-content:center; font-size:15px; text-decoration:none;
  }
  .popup-phone{
    display:block; font-size:13px; font-weight:800; color:#7fe0a8; margin-bottom:8px; text-decoration:none;
  }
  .li-edit{flex-shrink:0; width:34px; height:34px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--muted); display:flex; align-items:center; justify-content:center; font-size:15px; cursor:pointer;}
  .empty-note{text-align:center; color:var(--muted); font-size:13px; margin-top:60px; line-height:1.8;}

  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:50; display:none; align-items:flex-end;}
  .overlay.show{display:flex;}
  .sheet{
    width:100%; max-height:90vh; overflow-y:auto; background:var(--panel); border-radius:20px 20px 0 0;
    padding:18px 18px calc(24px + env(safe-area-inset-bottom));
  }
  .sheet h2{margin:0 0 14px; font-size:18px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--muted); font-weight:700; margin-bottom:6px;}
  .field input{
    width:100%; padding:12px 12px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2);
    color:var(--white); font-size:15px;
  }
  .field input:focus{outline:2px solid var(--amber); border-color:var(--amber);}
  .day-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .day-chip{
    padding:10px 0; text-align:center; border-radius:9px; background:var(--panel-2); border:1px solid var(--line);
    font-size:13px; font-weight:700; color:var(--muted); cursor:pointer;
  }
  .day-chip.on{background:var(--amber); color:#1a1400; border-color:var(--amber);}
  .day-chip.daily{grid-column:span 4; background:#3a2f14; color:var(--amber); border-color:var(--amber);}
  .day-chip.daily.on{background:var(--amber); color:#1a1400;}
  .quick-chips{display:flex; gap:7px; flex-wrap:wrap; margin-top:8px;}
  .quick-chip{padding:6px 12px; border-radius:20px; background:var(--panel-2); border:1px solid var(--line);
    font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer;}
  .quick-chip.on{background:var(--amber); color:#1a1400; border-color:var(--amber);}
  .sheet-actions{display:flex; gap:10px; margin-top:6px;}
  .btn{flex:1; padding:13px 0; border-radius:11px; border:none; font-weight:800; font-size:15px; cursor:pointer;}
  .btn.primary{background:var(--amber); color:#1a1400;}
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line);}
  .btn.danger{background:transparent; color:var(--go); border:1px solid var(--go); flex:0 0 44px;}
  .btn:disabled{opacity:.5;}
  .hint{font-size:11.5px; color:var(--muted); margin-top:-6px; margin-bottom:14px; line-height:1.6;}
  .status-msg{font-size:13px; margin-top:-4px; margin-bottom:12px; min-height:16px;}


  .locate-btn{
    position:absolute; right:14px; top:60px; z-index:15;
    background:rgba(22,29,25,.92); border:1px solid var(--line); border-radius:20px;
    padding:8px 14px; font-size:12px; font-weight:700; color:var(--white); cursor:pointer;
    backdrop-filter:blur(4px); display:flex; align-items:center; gap:6px;
  }
  .locate-btn.active{background:#1c3a63; border-color:#3b6fb8; color:#bcd6ff;}
  .user-dot-wrap{width:20px; height:20px; display:flex; align-items:center; justify-content:center;}
  .user-dot{width:14px; height:14px; border-radius:50%; background:#3b82f6; border:2px solid #fff; box-shadow:0 0 0 3px rgba(59,130,246,.35);}
  .user-dot-pulse{position:absolute; width:14px; height:14px; border-radius:50%; background:rgba(59,130,246,.5); animation:pulse-dot 1.8s ease-out infinite;}
  @keyframes pulse-dot{0%{transform:scale(1); opacity:.7;} 100%{transform:scale(2.8); opacity:0;}}
  .sort-row{display:flex; align-items:center; gap:8px; margin-top:9px; flex-wrap:wrap;}
  .sort-toggle{
    padding:6px 13px; border-radius:20px; background:var(--panel-2); border:1px solid var(--line);
    font-size:12.5px; font-weight:700; color:var(--muted); cursor:pointer;
  }
  .sort-toggle.on{background:#1c3a63; border-color:#3b6fb8; color:#bcd6ff;}
  .sort-toggle.danger-toggle{background:#2e1414; border-color:#5a2323; color:#e6a3a3;}
  .select-bar{display:flex; align-items:center; gap:8px; margin-top:9px; flex-wrap:wrap;}
  .li-check{
    flex-shrink:0; width:22px; height:22px; border-radius:6px; border:2px solid var(--line); background:var(--panel-2);
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:900; color:transparent;
  }
  .li-check.checked{background:var(--go); border-color:var(--go); color:#fff;}
  .li-dist{color:#7fb0ff; font-weight:800;}
  .candidate-list{margin-top:-6px; margin-bottom:12px; display:flex; flex-direction:column; gap:6px;}
  .candidate-item{
    text-align:left; padding:10px 12px; border-radius:9px; background:var(--panel-2); border:1px solid var(--line);
    color:var(--white); font-size:13px; cursor:pointer; line-height:1.4;
  }
  .candidate-item:active{background:var(--amber); color:#1a1400;}
  .candidate-item small{display:block; color:var(--muted); font-size:11px; margin-top:2px;}
  .candidate-item:active small{color:#4a3a10;}
  .tab, .course-chip, .quick-chip, .day-chip, .list-item, .status-dot, .li-body, .li-edit, .li-move, .li-call, .cc-edit, .li-check,
  .fab, .style-toggle, .locate-btn, .sort-toggle, .btn, .candidate-item, .popup-btn{
    touch-action: manipulation;
  }
  .status-msg.err{color:var(--go);}
  .status-msg.ok{color:var(--done);}
  .geo-status{
    font-size:12.5px; font-weight:700; padding:8px 12px; border-radius:9px; margin-bottom:10px; display:none;
  }
  .geo-status.set{display:block; background:#12301e; color:#7fe0a8; border:1px solid #1f5a38;}
  .geo-status.unset{display:block; background:var(--panel-2); color:var(--muted); border:1px solid var(--line);}
</style>
</head>
<body>
<div id="app">

  <div id="home-view">
    <div class="home-header">
      <div class="brand">天文館 廃棄回収</div>
      <div class="home-date" id="homeDateLine">-- -- --</div>
      <div class="home-title">コースを選んでください</div>
    </div>
    <div id="courseCards"></div>
  </div>

  <div id="work-container">
    <header>
      <div class="top-row">
        <div class="back-btn" id="backHome">← コース</div>
        <div>
          <div class="brand" id="workBrand">天文館 廃棄回収</div>
          <div class="date-line" id="dateLine">-- -- --<span class="yobi" id="yobiLine"></span></div>
        </div>
      </div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" id="progFill"></div></div>
        <div class="progress-num" id="progNum"><b>0</b> / 0 完了</div>
        <div class="progress-num" id="remainNum" style="color:var(--go)">残り <b>0</b> 件</div>
      </div>
      <div class="tabbar">
        <div class="tab active" data-tab="map">地図</div>
        <div class="tab" data-tab="list">リスト</div>
      </div>
      <div class="course-row" id="courseRow"></div>
      <div class="sort-row">
        <div class="sort-toggle" id="sortToggle">📍 近い順に並べる</div>
        <div class="sort-toggle" id="csvImportBtn">📥 CSVで一括登録</div>
        <div class="sort-toggle" id="selectModeBtn">🗑 選択削除</div>
        <input type="file" id="csvFileInput" accept=".csv" style="display:none;">
      </div>
      <div class="select-bar" id="selectBar" style="display:none;">
        <div class="sort-toggle" id="selectAllBtn">全選択</div>
        <div class="sort-toggle danger-toggle" id="deleteSelectedBtn">選択した0件を削除</div>
        <div class="sort-toggle" id="cancelSelectBtn">キャンセル</div>
      </div>
    </header>

    <div id="map-view">
      <div id="map"></div>
      <button class="style-toggle" id="styleToggle">🎨 <span id="styleLabel">モノクロ</span></button>
      <div class="map-hint">長押しでピン追加／既存ピンはドラッグで位置修正</div>
      <button class="locate-btn" id="locateBtn">📍 現在地</button>
      <div class="legend">
        <span><i class="go"></i>未回収 <b id="legendGo">0</b></span>
        <span><i class="done"></i>回収済 <b id="legendDone">0</b></span>
      </div>
    </div>

    <div id="list-view"></div>

    <button class="fab" id="fabAdd" aria-label="場所を追加">＋</button>
  </div>

  <div class="toast" id="toast"></div>
  <div class="fatal-banner" id="fatalBanner"></div>

</div>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">回収先を追加</h2>
    <div class="field">
      <label>店舗・事業所名</label>
      <input id="inName" type="text" placeholder="例）居酒屋 やまと 天文館店">
    </div>
    <div class="field">
      <label>住所 または Googleマップの座標</label>
      <input id="inAddr" type="text" placeholder="例）31.5966, 130.5571（空欄でもOK）">
    </div>
    <button class="btn ghost" id="btnSearchPos" style="margin-bottom:10px; width:100%;">🔍 位置を検索してみる（コンビニ等は当たりやすい）</button>
    <div class="hint">検索は任意です。当たらなくても保存できます（未検索なら仮ピン、保存後は地図でドラッグ調整）。座標を貼るとそれが最優先で使われます。</div>
    <div class="candidate-list" id="candidateList"></div>
    <div class="field">
      <label>コース</label>
      <input id="inCourse" type="text" placeholder="例）コースA">
      <div class="quick-chips" id="courseQuick"></div>
    </div>
    <div class="field">
      <label>電話番号（任意）</label>
      <input id="inPhone" type="tel" placeholder="例）099-123-4567">
    </div>
    <div class="field">
      <label>回収スケジュール</label>
      <div class="day-grid" id="dayGrid">
        <div class="day-chip daily" data-day="daily">毎日</div>
        <div class="day-chip" data-day="mon">月</div>
        <div class="day-chip" data-day="tue">火</div>
        <div class="day-chip" data-day="wed">水</div>
        <div class="day-chip" data-day="thu">木</div>
        <div class="day-chip" data-day="fri">金</div>
        <div class="day-chip" data-day="sat">土</div>
        <div class="day-chip" data-day="sun">日</div>
      </div>
    </div>
    <div class="status-msg" id="addStatus"></div>
    <div class="sheet-actions">
      <button class="btn danger" id="btnDelete" style="display:none">削除</button>
      <button class="btn ghost" id="btnCancel">キャンセル</button>
      <button class="btn primary" id="btnSave">保存する</button>
    </div>
  </div>
</div>

<script>
(function(){
  const WEEKDAYS = ['sun','mon','tue','wed','thu','fri','sat'];
  const WEEKDAYS_JA = {sun:'日',mon:'月',tue:'火',wed:'水',thu:'木',fri:'金',sat:'土'};
  const CENTER = [31.5966, 130.5571];
  const todayKey = () => {
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  };
  const todayWd = () => WEEKDAYS[new Date().getDay()];

  let locations = [];
  let collectedMap = {};
  let courses = [];
  let map, markersById = {};
  let currentTab = 'map';
  let currentCourse = 'all';
  let appView = 'home';
  let editingId = null;
  let selectedDays = new Set();

  // ---- Supabase接続 ----
  const SUPABASE_URL = 'https://gebjrhwfaoyjgmysplhb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdlYmpyaHdmYW95amdteXNwbGhiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTM0MjAsImV4cCI6MjA5NTg2OTQyMH0.uvRUg94EYo5bKCFJFLjf_bEqA4607gToTDje4HjgauA';
  let sb = null;
  try{
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }catch(e){
    showFatalBanner('Supabaseクライアントの初期化に失敗しました: ' + e.message);
  }

  async function loadLocations(){
    try{
      const { data, error } = await sb.from('gomi_locations').select('*').order('created_at', {ascending:true});
      if(error) throw error;
      locations = (data || []).map(row => ({
        id: row.id, name: row.name, address: row.address || '', course: row.course || '',
        lat: row.lat, lng: row.lng, schedule: row.schedule, mapAddress: row.map_address || '',
        sortOrder: (row.sort_order != null) ? row.sort_order : 0, phone: row.phone || ''
      }));
    }catch(e){
      locations = [];
      showFatalBanner('回収先データの読み込みに失敗しました: ' + (e.message || e));
    }
  }

  async function upsertLocationRow(loc){
    try{
      const { error } = await sb.from('gomi_locations').upsert({
        id: loc.id, name: loc.name, address: loc.address, course: loc.course,
        lat: loc.lat, lng: loc.lng, schedule: loc.schedule, map_address: loc.mapAddress || '',
        sort_order: loc.sortOrder || 0, phone: loc.phone || ''
      });
      if(error) throw error;
    }catch(e){
      showFatalBanner('保存に失敗しました: ' + (e.message || e));
    }
  }

  async function upsertLocationRows(rows){
    try{
      const { error } = await sb.from('gomi_locations').upsert(rows.map(loc => ({
        id: loc.id, name: loc.name, address: loc.address, course: loc.course,
        lat: loc.lat, lng: loc.lng, schedule: loc.schedule, map_address: loc.mapAddress || '',
        sort_order: loc.sortOrder || 0, phone: loc.phone || ''
      })));
      if(error) throw error;
    }catch(e){
      showFatalBanner('一括保存に失敗しました: ' + (e.message || e));
    }
  }

  async function deleteLocationRow(id){
    try{
      await sb.from('gomi_collections').delete().eq('location_id', id);
      const { error } = await sb.from('gomi_locations').delete().eq('id', id);
      if(error) throw error;
    }catch(e){
      showFatalBanner('削除に失敗しました: ' + (e.message || e));
    }
  }

  async function deleteLocationRows(ids){
    try{
      await sb.from('gomi_collections').delete().in('location_id', ids);
      const { error } = await sb.from('gomi_locations').delete().in('id', ids);
      if(error) throw error;
    }catch(e){
      showFatalBanner('一括削除に失敗しました: ' + (e.message || e));
    }
  }

  async function loadCourses(){
    try{
      const { data, error } = await sb.from('gomi_courses').select('*').order('sort_order', {ascending:true});
      if(error) throw error;
      courses = (data || []).map(row => ({id: row.id, name: row.name}));
    }catch(e){
      courses = [];
    }
  }

  async function insertCourse(name){
    const row = {id: 'course_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), name, sort_order: Date.now()};
    courses.push({id: row.id, name});
    renderHome();
    try{
      const { error } = await sb.from('gomi_courses').insert(row);
      if(error) throw error;
    }catch(e){
      showFatalBanner('コースの追加に失敗しました: ' + (e.message || e));
    }
  }

  async function renameCourseEverywhere(oldName, newName){
    // 該当コースの回収先すべてを付け替え
    const affected = locations.filter(l => (l.course || '').trim() === oldName);
    affected.forEach(l => { l.course = newName; });
    if(currentCourse === oldName) currentCourse = newName;

    // マスターのコース名も更新（なければ新規作成）
    const existing = courses.find(c => c.name === oldName);
    if(existing){
      existing.name = newName;
    } else {
      courses.push({id: 'course_'+Date.now()+'_'+Math.random().toString(36).slice(2,7), name: newName});
    }

    renderAll();
    showToast('コース名を更新しました');

    try{
      if(affected.length) await upsertLocationRows(affected);
      if(existing){
        const { error } = await sb.from('gomi_courses').update({name: newName}).eq('id', existing.id);
        if(error) throw error;
      } else {
        const created = courses[courses.length - 1];
        const { error } = await sb.from('gomi_courses').insert({id: created.id, name: created.name, sort_order: Date.now()});
        if(error) throw error;
      }
    }catch(e){
      showFatalBanner('コース名の更新に失敗しました: ' + (e.message || e));
    }
  }

  async function loadCollected(){
    try{
      const { data, error } = await sb.from('gomi_collections').select('location_id, collected').eq('date', todayKey());
      if(error) throw error;
      collectedMap = {};
      (data || []).forEach(r => { if(r.collected) collectedMap[r.location_id] = true; });
    }catch(e){
      collectedMap = {};
      showFatalBanner('回収状況の読み込みに失敗しました: ' + (e.message || e));
    }
  }

  async function setCollectedRow(id, val){
    try{
      if(val){
        const { error } = await sb.from('gomi_collections')
          .upsert({date: todayKey(), location_id: id, collected: true, updated_at: new Date().toISOString()});
        if(error) throw error;
      } else {
        const { error } = await sb.from('gomi_collections').delete().eq('date', todayKey()).eq('location_id', id);
        if(error) throw error;
      }
    }catch(e){
      showFatalBanner('回収状態の保存に失敗しました: ' + (e.message || e));
    }
  }

  function subscribeRealtime(){
    if(!sb) return;
    sb.channel('gomi-sync')
      .on('postgres_changes', {event:'*', schema:'public', table:'gomi_locations'}, async () => {
        await loadLocations(); renderAll();
      })
      .on('postgres_changes', {event:'*', schema:'public', table:'gomi_collections'}, async () => {
        await loadCollected(); renderAll();
      })
      .on('postgres_changes', {event:'*', schema:'public', table:'gomi_courses'}, async () => {
        await loadCourses(); renderAll();
      })
      .subscribe();
  }

  function allTodays(){
    const wd = todayWd();
    return locations
      .filter(l => l.schedule === 'daily' || (Array.isArray(l.schedule) && l.schedule.includes(wd)))
      .sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
  }
  function visibleTodays(){
    const t = allTodays();
    if(currentCourse === 'all') return t;
    return t.filter(l => (l.course || '未設定') === currentCourse);
  }
  function courseList(){
    const set = new Set();
    locations.forEach(l => set.add(l.course && l.course.trim() ? l.course.trim() : '未設定'));
    courses.forEach(c => { if(c.name && c.name.trim()) set.add(c.name.trim()); });
    return Array.from(set).sort();
  }

  function renderCourseRow(){
    const row = document.getElementById('courseRow');
    const courses = courseList();
    let html = '<div class="course-chip '+(currentCourse==='all'?'active':'')+'" data-course="all">すべて</div>';
    html += courses.map(c => '<div class="course-chip '+(currentCourse===c?'active':'')+'" data-course="'+escapeHtml(c)+'">'+escapeHtml(c)+'</div>').join('');
    row.innerHTML = html;
    row.querySelectorAll('.course-chip').forEach(chip => {
      chip.onclick = () => { currentCourse = chip.dataset.course; renderAll(); };
    });
  }

  function renderHeader(){
    const d = new Date();
    document.getElementById('dateLine').innerHTML =
      (d.getMonth()+1)+'月'+d.getDate()+'日 <span class="yobi">('+WEEKDAYS_JA[todayWd()]+')</span>';
    const todays = visibleTodays();
    const done = todays.filter(l => collectedMap[l.id]).length;
    const total = todays.length;
    const remain = total - done;
    const pct = total ? Math.round(done/total*100) : 0;
    document.getElementById('progFill').style.width = pct+'%';
    document.getElementById('progNum').innerHTML = '<b>'+done+'</b> / '+total+' 完了';
    document.getElementById('remainNum').innerHTML = '残り <b>'+remain+'</b> 件';
    const legendGo = document.getElementById('legendGo');
    const legendDone = document.getElementById('legendDone');
    if(legendGo) legendGo.textContent = remain;
    if(legendDone) legendDone.textContent = done;
  }

  function initMap(){
    map = L.map('map', {zoomControl:true}).setView(CENTER, 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19, attribution:'&copy; OpenStreetMap'
    }).addTo(map);
  }

  function pinIcon(done){
    return L.divIcon({
      className:'', html:'<div class="pin '+(done?'done':'go')+'"><div class="pin-dot"></div></div>',
      iconSize:[30,30], iconAnchor:[15,28], popupAnchor:[0,-26]
    });
  }

  function toggleCollected(id){
    const newVal = !collectedMap[id];
    collectedMap[id] = newVal;
    renderAll();
    setCollectedRow(id, newVal);
  }

  function renderMarkers(){
    if(!map) return;
    Object.values(markersById).forEach(m => map.removeLayer(m));
    markersById = {};
    visibleTodays().forEach(loc => {
      if(loc.lat == null || loc.lng == null) return;
      const done = !!collectedMap[loc.id];
      const marker = L.marker([loc.lat, loc.lng], {icon:pinIcon(done), draggable:true, autoPan:true}).addTo(map);
      const popupHtml =
        '<div class="popup-name">'+escapeHtml(loc.name)+'</div>'+
        (loc.course ? '<div class="popup-meta">'+escapeHtml(loc.course)+'</div>' : '')+
        '<div class="popup-addr"><b>📝入力:</b> '+escapeHtml(loc.address || '(未入力)')+'</div>'+
        '<div class="popup-addr map-addr"><b>📍地図上:</b> '+escapeHtml(loc.mapAddress || '取得中…')+'</div>'+
        (loc.phone ? '<a class="popup-phone" href="tel:'+escapeHtml(loc.phone)+'">📞 '+escapeHtml(loc.phone)+'</a>' : '')+
        '<div class="popup-hint">長押ししてドラッグすると位置を修正できます</div>'+
        '<div class="popup-actions">'+
          '<button class="popup-btn edit" data-act="edit" data-id="'+loc.id+'">編集</button>'+
          '<button class="popup-btn '+(done?'mark-go':'mark-done')+'" data-act="toggle" data-id="'+loc.id+'">'+
            (done ? '未回収に戻す' : '回収済にする')+
          '</button>'+
        '</div>';
      marker.bindPopup(popupHtml);
      marker.on('dragend', async () => {
        const ll = marker.getLatLng();
        loc.lat = ll.lat; loc.lng = ll.lng;
        loc.mapAddress = '取得中…';
        showToast('位置を更新しました。地図上の住所を確認中…');
        renderAll();
        const addr = await reverseGeocode(ll.lat, ll.lng);
        loc.mapAddress = addr || '';
        renderAll();
        marker.openPopup();
        await upsertLocationRow(loc);
      });
      marker.on('popupopen', () => {
        document.querySelectorAll('.leaflet-popup-content .popup-btn').forEach(btn => {
          btn.onclick = () => {
            if(btn.dataset.act === 'toggle'){ toggleCollected(loc.id); marker.closePopup(); }
            else{ openSheet(loc.id); marker.closePopup(); }
          };
        });
      });
      markersById[loc.id] = marker;
    });
  }

  let selectMode = false;
  let selectedIds = new Set();

  function renderList(){
    const el = document.getElementById('list-view');
    const todays = orderedTodays();
    if(todays.length === 0){
      el.innerHTML = '<div class="empty-note">本日回収予定の場所がありません。<br>右下の「＋」から回収先を追加してください。</div>';
      updateSelectBar();
      return;
    }
    el.innerHTML = todays.map((loc, i) => {
      const done = !!collectedMap[loc.id];
      let tag = (loc.schedule === 'daily' ? '毎日回収' : '曜日指定') + (loc.course ? ' ・ '+escapeHtml(loc.course) : '');
      if(currentPos){
        tag += ' ・ <span class="li-dist">'+formatDist(distMeters(currentPos, loc))+'</span>';
      }
      const reorderHtml = (sortByDistance || selectMode) ? '' :
        '<div class="li-reorder">'+
          '<div class="li-move" data-act="up" '+(i===0?'style="opacity:.25;pointer-events:none;"':'')+'>▲</div>'+
          '<div class="li-move" data-act="down" '+(i===todays.length-1?'style="opacity:.25;pointer-events:none;"':'')+'>▼</div>'+
        '</div>';
      const callHtml = (loc.phone && !selectMode) ?
        '<a class="li-call" href="tel:'+escapeHtml(loc.phone)+'" onclick="event.stopPropagation()">📞</a>' : '';
      const checked = selectedIds.has(loc.id);
      const leftHtml = selectMode ?
        '<div class="li-check '+(checked?'checked':'')+'" data-act="check">✓</div>' :
        '<div class="status-dot '+(done?'done':'go')+'" data-act="toggle"></div>';
      const editHtml = selectMode ? '' : '<div class="li-edit" data-act="edit">✎</div>';
      return '<div class="list-item '+(done?'done':'')+' '+(checked?'selected':'')+'" data-id="'+loc.id+'">'+
        leftHtml+
        '<div class="li-body" data-act="toggle">'+
          '<div class="li-name">'+escapeHtml(loc.name)+'</div>'+
          '<div class="li-addr">📝 '+escapeHtml(loc.address||'(未入力)')+'</div>'+
          '<div class="li-addr li-addr-map">📍 '+escapeHtml(loc.mapAddress||'未取得')+'</div>'+
          '<div class="li-tag">'+tag+'</div>'+
        '</div>'+
        reorderHtml+
        callHtml+
        editHtml+
      '</div>';
    }).join('');
    el.querySelectorAll('.list-item').forEach(node => {
      const id = node.dataset.id;
      if(selectMode){
        node.querySelectorAll('[data-act="toggle"], [data-act="check"]').forEach(n => n.onclick = () => toggleSelected(id));
      } else {
        node.querySelectorAll('[data-act="toggle"]').forEach(n => n.onclick = () => toggleCollected(id));
        const editBtn = node.querySelector('[data-act="edit"]');
        if(editBtn) editBtn.onclick = () => openSheet(id);
        const upBtn = node.querySelector('[data-act="up"]');
        const downBtn = node.querySelector('[data-act="down"]');
        if(upBtn) upBtn.onclick = () => moveItem(id, -1);
        if(downBtn) downBtn.onclick = () => moveItem(id, 1);
      }
    });
    updateSelectBar();
  }

  function toggleSelected(id){
    if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
    renderList();
  }

  function updateSelectBar(){
    const bar = document.getElementById('selectBar');
    bar.style.display = selectMode ? 'flex' : 'none';
    document.getElementById('deleteSelectedBtn').textContent = '選択した'+selectedIds.size+'件を削除';
  }

  document.getElementById('selectModeBtn').onclick = () => {
    selectMode = !selectMode;
    selectedIds = new Set();
    renderList();
  };
  document.getElementById('cancelSelectBtn').onclick = () => {
    selectMode = false;
    selectedIds = new Set();
    renderList();
  };
  document.getElementById('selectAllBtn').onclick = () => {
    const todays = orderedTodays();
    if(selectedIds.size === todays.length){
      selectedIds = new Set();
    } else {
      selectedIds = new Set(todays.map(l => l.id));
    }
    renderList();
  };
  document.getElementById('deleteSelectedBtn').onclick = async () => {
    if(selectedIds.size === 0){
      showToast('削除する項目を選んでください');
      return;
    }
    if(!confirm('選択した'+selectedIds.size+'件を削除します。よろしいですか？')) return;
    const ids = Array.from(selectedIds);
    locations = locations.filter(l => !selectedIds.has(l.id));
    ids.forEach(id => delete collectedMap[id]);
    selectMode = false;
    selectedIds = new Set();
    renderAll();
    showToast(ids.length+'件を削除しました');
    await deleteLocationRows(ids);
  };

  async function moveItem(id, direction){
    const list = orderedTodays();
    const idx = list.findIndex(l => l.id === id);
    const swapIdx = idx + direction;
    if(idx === -1 || swapIdx < 0 || swapIdx >= list.length) return;
    const a = list[idx], b = list[swapIdx];
    const tmp = a.sortOrder || 0;
    a.sortOrder = b.sortOrder || 0;
    b.sortOrder = tmp;
    renderAll();
    await upsertLocationRows([a, b]);
  }

  function renderAll(){
    renderCourseRow();
    renderHeader();
    if(currentTab === 'map') renderMarkers();
    renderList();
    renderHome();
  }

  function renderHome(){
    const d = new Date();
    document.getElementById('homeDateLine').textContent = (d.getMonth()+1)+'月'+d.getDate()+'日 ('+WEEKDAYS_JA[todayWd()]+')';
    const todays = allTodays();
    const wrap = document.getElementById('courseCards');

    const addCourseHtml = '<div class="course-card add-card" id="addCourseCard"><div><div class="cc-name">＋ 新規コース</div><div class="cc-sub">コース名を作成</div></div></div>';

    if(locations.length === 0){
      wrap.innerHTML = addCourseHtml +
        '<div class="home-empty">まだ回収先が登録されていません。<br>「すべて表示」から地図を開いて、右下の「＋」または長押しで登録を始めてください。</div>'+
        '<div class="course-card all-card" data-course="all"><div><div class="cc-name">すべて表示</div><div class="cc-sub">コース未設定でまず始める</div></div><div class="cc-count">→</div></div>';
    } else {
      const courseNames = courseList();
      let html = '<div class="course-card all-card" data-course="all"><div><div class="cc-name">すべて表示</div><div class="cc-sub">全コース合算</div></div>'+
        '<div class="cc-count">'+(todays.length - todays.filter(l=>collectedMap[l.id]).length)+'<small>残り / '+todays.length+'件</small></div></div>';
      html += courseNames.map(c => {
        const list = todays.filter(l => (l.course || '未設定') === c);
        const done = list.filter(l => collectedMap[l.id]).length;
        const remain = list.length - done;
        const editBtn = c === '未設定' ? '' : '<div class="cc-edit" data-rename="'+escapeHtml(c)+'">✎</div>';
        return '<div class="course-card" data-course="'+escapeHtml(c)+'"><div><div class="cc-name">'+escapeHtml(c)+'</div>'+
          '<div class="cc-sub">本日 '+list.length+'件</div></div>'+
          '<div class="cc-count">'+remain+'<small>残り / '+list.length+'件</small></div>'+editBtn+'</div>';
      }).join('');
      wrap.innerHTML = addCourseHtml + html;
    }

    wrap.querySelectorAll('.course-card[data-course]').forEach(card => {
      card.onclick = () => {
        currentCourse = card.dataset.course;
        appView = 'work';
        showView();
        renderAll();
      };
    });
    wrap.querySelectorAll('.cc-edit').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const oldName = btn.dataset.rename;
        const newName = prompt('コース名を変更', oldName);
        if(newName && newName.trim() && newName.trim() !== oldName){
          renameCourseEverywhere(oldName, newName.trim());
        }
      };
    });
    const addBtn = document.getElementById('addCourseCard');
    if(addBtn){
      addBtn.onclick = () => {
        const name = prompt('新しいコース名を入力してください（例: コースC）');
        if(name && name.trim()){
          if(courseList().includes(name.trim())){
            showToast('そのコース名は既に存在します');
          } else {
            insertCourse(name.trim());
          }
        }
      };
    }
  }

  function showView(){
    document.getElementById('home-view').style.display = appView === 'home' ? 'flex' : 'none';
    document.getElementById('work-container').style.display = appView === 'work' ? 'flex' : 'none';
    if(appView === 'work' && currentTab === 'map' && map){
      setTimeout(() => map.invalidateSize(), 50);
    }
  }

  document.getElementById('backHome').onclick = () => {
    appView = 'home';
    showView();
    renderHome();
  };

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  document.querySelectorAll('.tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      currentTab = tab.dataset.tab;
      document.getElementById('map-view').style.display = currentTab==='map' ? 'block' : 'none';
      document.getElementById('list-view').style.display = currentTab==='list' ? 'block' : 'none';
      if(currentTab==='map'){ setTimeout(()=>map.invalidateSize(), 50); renderMarkers(); }
    };
  });

  const overlay = document.getElementById('overlay');


  // 地図の色は端末ごとの個人設定なのでlocalStorageで十分(Supabase同期は不要)
  let mapStyle = 'gray';
  function loadMapStyle(){
    try{
      const v = localStorage.getItem('gomi-map-style-pref');
      mapStyle = (v === 'color' || v === 'gray') ? v : 'gray';
    }catch(e){ mapStyle = 'gray'; }
  }
  function saveMapStyle(){
    try{ localStorage.setItem('gomi-map-style-pref', mapStyle); }catch(e){}

  let toastTimer = null;

  async function dropPinAt(latlng){
    const loc = {
      id: 'loc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      name: '名称未設定',
      address: '',
      mapAddress: '住所を取得中…',

    };

    renderAll();
    await upsertLocationRow(loc);
  }

  function wireMapPinDrop(){
    // PC: 右クリックで直接ピン（既存ピンの上での右クリックは除外）
    map.on('contextmenu', (e) => {
      if(e.originalEvent && e.originalEvent.target && e.originalEvent.target.closest && e.originalEvent.target.closest('.pin')) return;
      dropPinAt(e.latlng);
    });

    // モバイル: 長押しでピン（既存ピンの上はLeafletのドラッグに任せるため対象外にする）
    let pressTimer = null;
    let startPoint = null;
    let longPressFired = false;
    const THRESHOLD = 10;
    const HOLD_MS = 600;

    map.getContainer().addEventListener('touchstart', (e) => {
      if(e.touches.length !== 1) return;
      if(e.target && e.target.closest && e.target.closest('.pin')) return;
      const t = e.touches[0];
      startPoint = {x:t.clientX, y:t.clientY};
      longPressFired = false;
      pressTimer = setTimeout(() => {
        longPressFired = true;
        const rect = map.getContainer().getBoundingClientRect();
        const point = L.point(startPoint.x - rect.left, startPoint.y - rect.top);
        const latlng = map.containerPointToLatLng(point);
        dropPinAt(latlng);
        pressTimer = null;
      }, HOLD_MS);
    }, {passive:true});

    map.getContainer().addEventListener('touchmove', (e) => {
      if(!startPoint || !pressTimer) return;
      const t = e.touches[0];
      const dx = t.clientX - startPoint.x, dy = t.clientY - startPoint.y;
      if(Math.sqrt(dx*dx+dy*dy) > THRESHOLD){
        clearTimeout(pressTimer); pressTimer = null;
      }
    }, {passive:true});

    const clearPress = () => {
      if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
      startPoint = null;
    };
    map.getContainer().addEventListener('touchend', clearPress);
    map.getContainer().addEventListener('touchcancel', clearPress);
  }


  let currentPos = null;
  let watchId = null;
  let userMarker = null, accuracyCircle = null;
  let sortByDistance = false;

  function distMeters(a, b){
    const R = 6371000;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
    const lat1 = toRad(a.lat), lat2 = toRad(b.lat);
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function formatDist(m){
    return m < 1000 ? Math.round(m) + 'm' : (m/1000).toFixed(1) + 'km';
  }

  function orderedTodays(){
    const list = visibleTodays();
    if(sortByDistance && currentPos){
      return [...list].sort((a,b) => distMeters(currentPos,a) - distMeters(currentPos,b));
    }
    return list;
  }

  function updateUserMarker(){
    if(!currentPos) return;
    const ll = [currentPos.lat, currentPos.lng];
    if(!userMarker){
      userMarker = L.marker(ll, {
        icon: L.divIcon({
          className:'', iconSize:[20,20], iconAnchor:[10,10],
          html:'<div class="user-dot-wrap"><div class="user-dot-pulse"></div><div class="user-dot"></div></div>'
        }),
        zIndexOffset: 1000
      }).addTo(map);
      accuracyCircle = L.circle(ll, {radius: currentPos.accuracy || 30, color:'#3b82f6', weight:1, fillColor:'#3b82f6', fillOpacity:.12}).addTo(map);
    } else {
      userMarker.setLatLng(ll);
      accuracyCircle.setLatLng(ll);
      accuracyCircle.setRadius(currentPos.accuracy || 30);
    }
  }

  function startLocating(){
    if(!navigator.geolocation){
      showToast('この端末では現在地を取得できません');
      return;
    }
    document.getElementById('locateBtn').classList.add('active');
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        currentPos = {lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy};
        updateUserMarker();
        map.setView([currentPos.lat, currentPos.lng], 17);
        renderAll();
      },
      () => { showToast('現在地を取得できませんでした（位置情報の許可を確認してください）'); },
      {enableHighAccuracy:true, timeout:8000}
    );
    if(watchId === null){
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          currentPos = {lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy};
          updateUserMarker();
          renderHeader(); renderList();
        },
        () => {},
        {enableHighAccuracy:true, maximumAge:5000}
      );
    }
  }

  document.getElementById('fabAdd').onclick = () => openSheet(null);
  document.getElementById('btnCancel').onclick = closeSheet;
  overlay.onclick = (e) => { if(e.target === overlay) closeSheet(); };

  function renderCourseQuick(){
    const wrap = document.getElementById('courseQuick');
    const courses = courseList().filter(c => c !== '未設定');
    wrap.innerHTML = courses.map(c => '<div class="quick-chip" data-c="'+escapeHtml(c)+'">'+escapeHtml(c)+'</div>').join('');
    wrap.querySelectorAll('.quick-chip').forEach(chip => {
      chip.onclick = () => { document.getElementById('inCourse').value = chip.dataset.c; };
    });
  }

  let searchedGeo = null;

  function openSheet(id){
    editingId = id;
    searchedGeo = null;
    const statusEl = document.getElementById('addStatus');
    statusEl.textContent = ''; statusEl.className = 'status-msg';
    document.getElementById('candidateList').innerHTML = '';
    renderCourseQuick();
    document.getElementById('btnDelete').style.display = id ? 'block' : 'none';

    if(id){
      const loc = locations.find(l => l.id === id);
      document.getElementById('sheetTitle').textContent = '回収先を編集';
      document.getElementById('inName').value = loc.name || '';
      document.getElementById('inAddr').value = loc.address || '';
      document.getElementById('inCourse').value = loc.course || '';
      document.getElementById('inPhone').value = loc.phone || '';
      selectedDays = new Set(loc.schedule === 'daily' ? ['daily'] : (loc.schedule || []));
    } else {
      document.getElementById('sheetTitle').textContent = '回収先を追加';
      document.getElementById('inName').value = '';
      document.getElementById('inAddr').value = '';
      document.getElementById('inCourse').value = '';
      document.getElementById('inPhone').value = '';
      selectedDays = new Set();
    }
    document.querySelectorAll('.day-chip').forEach(c => c.classList.toggle('on', selectedDays.has(c.dataset.day)));
    overlay.classList.add('show');
  }
  function closeSheet(){ overlay.classList.remove('show'); editingId = null; searchedGeo = null; }

  document.querySelectorAll('.day-chip').forEach(chip => {
    chip.onclick = () => {
      const day = chip.dataset.day;
      if(day === 'daily'){
        selectedDays = new Set(['daily']);
        document.querySelectorAll('.day-chip').forEach(c => c.classList.toggle('on', c.dataset.day==='daily'));
      } else {
        selectedDays.delete('daily');
        document.querySelector('.day-chip[data-day="daily"]').classList.remove('on');
        if(selectedDays.has(day)){ selectedDays.delete(day); chip.classList.remove('on'); }
        else{ selectedDays.add(day); chip.classList.add('on'); }
      }
    };
  });

  const TENMONKAN_CENTER = {lat: 31.5966, lng: 130.5571};

  async function reverseGeocode(lat, lng){
    try{
      const url = 'https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&zoom=18';
      const res = await fetch(url);
      if(!res.ok) return '';
      const data = await res.json();
      return (data && data.display_name) ? data.display_name : '';
    }catch(e){ return ''; }
  }

  document.getElementById('btnDelete').onclick = async () => {
    if(!editingId) return;
    if(!confirm('この回収先を削除しますか？')) return;
    const idToDelete = editingId;
    locations = locations.filter(l => l.id !== idToDelete);
    delete collectedMap[idToDelete];
    closeSheet();
    renderAll();
    await deleteLocationRow(idToDelete);
  };

  async function commitSave(geo, mapAddress){
    const name = document.getElementById('inName').value.trim();
    const addrInput = document.getElementById('inAddr').value.trim();
    const course = document.getElementById('inCourse').value.trim();
    const phone = document.getElementById('inPhone').value.trim();
    const schedule = selectedDays.has('daily') ? 'daily' : Array.from(selectedDays);
    let loc;

    if(editingId){
      loc = locations.find(l => l.id === editingId);
      loc.name = name; loc.address = addrInput; loc.course = course; loc.schedule = schedule; loc.phone = phone;
      loc.lat = geo.lat; loc.lng = geo.lng;
      if(mapAddress !== undefined) loc.mapAddress = mapAddress;
    } else {
      loc = {
        id: 'loc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
        name, address: addrInput, course, lat: geo.lat, lng: geo.lng, schedule, phone,
        mapAddress: mapAddress || '', sortOrder: Date.now()
      };
      locations.push(loc);
    }
    renderAll();
    closeSheet();
    await upsertLocationRow(loc);
  }

  function tryParseLatLng(text){
    if(!text) return null;
    // "31.5966, 130.5571" のような直接ペースト
    let m = text.match(/(-?\d{1,3}\.\d{3,})\s*,\s*(-?\d{1,3}\.\d{3,})/);
    // Googleマップ共有URLの "@lat,lng,zoom" 形式
    if(!m) m = text.match(/@(-?\d{1,3}\.\d{3,}),(-?\d{1,3}\.\d{3,})/);
    // "q=lat,lng" や "ll=lat,lng" 形式
    if(!m) m = text.match(/[?&](?:q|ll)=(-?\d{1,3}\.\d{3,}),(-?\d{1,3}\.\d{3,})/);
    if(!m) return null;
    const lat = parseFloat(m[1]), lng = parseFloat(m[2]);
    if(isNaN(lat) || isNaN(lng) || Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
    return {lat, lng};
  }

  async function geocodeCandidates(q){
    const c = currentPos || TENMONKAN_CENTER;
    const d = 0.045;
    const viewbox = (c.lng-d)+','+(c.lat+d)+','+(c.lng+d)+','+(c.lat-d);
    async function run(strict){
      const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=jp&viewbox='+viewbox
        + (strict ? '&bounded=1' : '') + '&addressdetails=1&q=' + encodeURIComponent(q);
      const res = await fetch(url);
      if(!res.ok) throw new Error('geocode failed');
      const data = await res.json();
      return data.map(d => ({lat: parseFloat(d.lat), lng: parseFloat(d.lon), label: d.display_name}));
    }
    let list = await run(true);
    if(list.length === 0) list = await run(false);
    return list;
  }

  function renderCandidates(list, statusEl){
    const wrap = document.getElementById('candidateList');
    if(list.length === 0){
      statusEl.textContent = 'この店は候補が見つかりませんでした。未検索のまま保存し、あとで地図でドラッグして位置を合わせてください。';
      statusEl.className = 'status-msg err';
      wrap.innerHTML = '';
      return;
    }
    statusEl.textContent = '近い候補を'+list.length+'件見つけました。合っているものをタップしてください。';
    statusEl.className = 'status-msg';
    wrap.innerHTML = list.map((c, i) =>
      '<div class="candidate-item" data-i="'+i+'">'+escapeHtml(c.label.split('、')[0] || c.label)+
      '<small>'+escapeHtml(c.label)+'</small></div>'
    ).join('');
    wrap.querySelectorAll('.candidate-item').forEach(node => {
      node.onclick = () => {
        const c = list[parseInt(node.dataset.i, 10)];
        searchedGeo = {lat: c.lat, lng: c.lng};
        document.getElementById('inAddr').value = c.label;
        wrap.innerHTML = '';
        statusEl.textContent = 'この場所で確定しました。「保存する」を押してください。';
        statusEl.className = 'status-msg ok';
      };
    });
  }

  document.getElementById('btnSearchPos').onclick = async () => {
    const name = document.getElementById('inName').value.trim();
    const addrInput = document.getElementById('inAddr').value.trim();
    const statusEl = document.getElementById('addStatus');
    const btn = document.getElementById('btnSearchPos');
    const query = addrInput || name;
    if(!query){
      statusEl.textContent = '店舗名か住所を入力してから検索してください。';
      statusEl.className = 'status-msg err';
      return;
    }
    btn.disabled = true;
    statusEl.textContent = '検索中…';
    statusEl.className = 'status-msg';
    try{
      const list = await geocodeCandidates(query);
      renderCandidates(list, statusEl);
    }catch(e){
      statusEl.textContent = '通信エラーが発生しました。';
      statusEl.className = 'status-msg err';
    }finally{
      btn.disabled = false;
    }
  };

  document.getElementById('btnSave').onclick = async () => {
    const name = document.getElementById('inName').value.trim();
    const addrInput = document.getElementById('inAddr').value.trim();
    const statusEl = document.getElementById('addStatus');

    if(!name){
      statusEl.textContent = '店舗名を入力してください。';
      statusEl.className = 'status-msg err';
      return;
    }
    if(selectedDays.size === 0){
      statusEl.textContent = '回収スケジュールを選んでください。';
      statusEl.className = 'status-msg err';
      return;
    }

    // 優先順位: ①座標の直接貼り付け ②検索で選んだ候補 ③(編集時)既存位置を維持 ④新規はエリア付近に仮置き
    const parsed = tryParseLatLng(addrInput);
    let geo, autoDefaulted = false, positionChanged = true;

    if(parsed){
      geo = parsed;
    } else if(searchedGeo){
      geo = searchedGeo;
    } else if(editingId){
      // 住所を打ち替えていない場合は既存の位置を維持（ドラッグで置いた位置を勝手に動かさない）
      const existing = locations.find(l => l.id === editingId);
      geo = {lat: existing.lat, lng: existing.lng};
      positionChanged = false;
    } else {
      // 新規かつ座標未指定 → 今のエリア付近に仮ピン
      const c = currentPos || (map ? map.getCenter() : TENMONKAN_CENTER);
      geo = {lat: c.lat, lng: c.lng};
      autoDefaulted = true;
    }

    let mapAddress;
    if(positionChanged){
      mapAddress = await reverseGeocode(geo.lat, geo.lng);
      if(parsed) document.getElementById('inAddr').value = mapAddress || addrInput;
    }

    await commitSave(geo, mapAddress);
    showToast(autoDefaulted ? '保存しました。地図でピンをドラッグして正確な位置に合わせてください' : '保存しました');
  };

  // ---- CSV一括インポート ----
  function parseScheduleField(raw){
    if(!raw || raw.trim() === '' || raw.trim() === '毎日') return 'daily';
    const map = {'月':'mon','火':'tue','水':'wed','木':'thu','金':'fri','土':'sat','日':'sun'};
    const parts = raw.split(/[\/、,]/).map(s => s.trim()).filter(Boolean);
    const days = parts.map(p => map[p]).filter(Boolean);
    return days.length ? days : 'daily';
  }

  async function geocodeAddressForImport(q){
    if(!q) return null;
    try{
      const c = currentPos || TENMONKAN_CENTER;
      const d = 0.045;
      const viewbox = (c.lng-d)+','+(c.lat+d)+','+(c.lng+d)+','+(c.lat-d);
      let url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&viewbox='+viewbox+'&bounded=1&q='+encodeURIComponent(q);
      let res = await fetch(url);
      let data = res.ok ? await res.json() : [];
      if(!data.length){
        url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&viewbox='+viewbox+'&q='+encodeURIComponent(q);
        res = await fetch(url);
        data = res.ok ? await res.json() : [];
      }
      if(!data.length) return null;
      return {lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon)};
    }catch(e){ return null; }
  }

  document.getElementById('csvImportBtn').onclick = () => {
    document.getElementById('csvFileInput').click();
  };

  document.getElementById('csvFileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const targetLabel = currentCourse !== 'all' ? ('「'+currentCourse+'」') : 'CSVのコース欄の内容';
    if(!confirm('この内容を'+targetLabel+'として一括登録します。よろしいですか？')){
      e.target.value = '';
      return;
    }
    Papa.parse(file, {
      encoding: 'UTF-8',
      skipEmptyLines: true,
      complete: async (results) => {
        let rows = results.data;
        if(rows.length && /^(店舗名|名前|name)$/i.test((rows[0][0]||'').trim())){
          rows = rows.slice(1);
        }
        rows = rows.filter(r => r[0] && r[0].trim());
        if(rows.length === 0){
          showToast('読み込める行がありませんでした');
          e.target.value = '';
          return;
        }

        const newLocs = [];
        for(let i = 0; i < rows.length; i++){
          const r = rows[i];
          const name = (r[0] || '').trim();
          const address = (r[1] || '').trim();
          // 今開いているコースの中で一括登録している場合は、そのコースを優先（CSVのコース欄は無視）
          const course = (currentCourse !== 'all') ? currentCourse : (r[2] || '').trim();
          const schedule = parseScheduleField(r[3] || '');
          const phone = (r[4] || '').trim();
          showToast('取り込み中… ('+(i+1)+'/'+rows.length+') '+name);

          let geo = null;
          let mapAddress = '';
          if(address){
            geo = await geocodeAddressForImport(address);
            if(geo) mapAddress = address; // 住所検索がヒットした場合はその住所をそのまま採用
            await new Promise(r => setTimeout(r, 1100)); // Nominatimのレート制限(1req/秒)対策
          }
          if(!geo){
            const c = currentPos || (map ? map.getCenter() : TENMONKAN_CENTER);
            geo = {lat: c.lat, lng: c.lng};
            mapAddress = '仮位置（要ドラッグ調整）';
          }

          newLocs.push({
            id: 'loc_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+'_'+i,
            name, address, course, lat: geo.lat, lng: geo.lng, schedule, mapAddress, phone,
            sortOrder: Date.now() + i
          });
        }

        locations = locations.concat(newLocs);
        renderAll();
        showToast(rows.length+'件を取り込みました。位置がズレているピンは地図でドラッグして直してください');
        await upsertLocationRows(newLocs);
        e.target.value = '';
      },
      error: () => {
        showToast('CSVの読み込みに失敗しました');
        e.target.value = '';
      }
    });
  });

  document.getElementById('styleToggle').onclick = () => {
    mapStyle = mapStyle === 'color' ? 'gray' : 'color';
    applyMapStyle();
    saveMapStyle();
  };

  document.getElementById('locateBtn').onclick = () => startLocating();
  document.getElementById('sortToggle').onclick = () => {
    sortByDistance = !sortByDistance;
    document.getElementById('sortToggle').classList.toggle('on', sortByDistance);
    if(sortByDistance && !currentPos) startLocating();
    renderAll();
  };

  (async function boot(){
    // 地図の初期化に失敗しても、リストや保存機能は独立して動くようにする
    try{
      initMap();
      wireMapPinDrop();
      setTimeout(() => map.invalidateSize(), 100);
      setTimeout(() => map.invalidateSize(), 500);
      setTimeout(() => map.invalidateSize(), 1200);
      window.addEventListener('resize', () => map.invalidateSize());
      window.addEventListener('orientationchange', () => setTimeout(() => map.invalidateSize(), 300));
    }catch(e){
      showFatalBanner('地図の初期化に失敗しました: ' + (e.message || e));
    }

    loadMapStyle();
    applyMapStyle();

    document.getElementById('list-view').style.display = 'none';
    showView();

    await loadLocations();
    await loadCollected();
    await loadCourses();
    renderAll();
    subscribeRealtime();
  })();

})();
